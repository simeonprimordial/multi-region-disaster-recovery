apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-api
  namespace: payment-production
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: paysecure
    paysecure.io/aws-identity: eks-pod-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transaction-processor
  namespace: payment-production
  labels:
    app.kubernetes.io/name: transaction-processor
    app.kubernetes.io/part-of: paysecure
    paysecure.io/aws-identity: eks-pod-identity
automountServiceAccountToken: false

# IAM roles are associated to these namespace/service-account pairs by
# Terraform aws_eks_pod_identity_association resources. No role ARN annotation
# is required for EKS Pod Identity, and no long-lived AWS credentials are stored
# in these Kubernetes manifests.
