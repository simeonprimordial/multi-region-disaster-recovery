apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-processor
  namespace: payment-production
  labels:
    app.kubernetes.io/name: transaction-processor
    app.kubernetes.io/part-of: paysecure
    paysecure.io/tier: critical
spec:
  replicas: 6
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-processor
        app.kubernetes.io/part-of: paysecure
        paysecure.io/tier: critical
    spec:
      serviceAccountName: transaction-processor
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: transaction-processor
      containers:
        - name: transaction-processor
          image: ghcr.io/example/paysecure/transaction-processor:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: paysecure-runtime-config
            - secretRef:
                name: paysecure-runtime-secrets
          resources:
            requests:
              cpu: 750m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-processor
  namespace: payment-production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: transaction-processor
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-processor
  namespace: payment-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-processor
  minReplicas: 6
  maxReplicas: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: transaction-processor
  namespace: payment-production
spec:
  minAvailable: 75%
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-processor
